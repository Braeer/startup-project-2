worker_processes auto;

events {
  worker_connections 1024;
}

http {
  upstream frontend {
    server next_frontend:3000;
  }

  upstream backend {
    server nest_api:4000;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://frontend;
    }

    location /api/ {
      proxy_pass http://backend;
    }
  }
}
