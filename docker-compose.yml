version: '3.8'

services:
  backend:
    build:
      context: ./nest-server
      dockerfile: Dockerfile.prod
    container_name: api_startup_project_2
    env_file:
      - .env
    environment:
      POSTGRES_URL: ${POSTGRES_URL}
      PORT: ${APPLICATION_PORT}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN}
      COOKIE_SECRET: ${COOKIE_SECRET}
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - startup_2_network
      - shared_db

  frontend:
    build:
      context: ./next-client
      dockerfile: Dockerfile.prod
    container_name: client_startup_project_2
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    networks:
      - startup_2_network

  nginx:
    image: nginx:latest
    container_name: nginx_startup_project_2
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '80:80'
    depends_on:
      - frontend
      - backend
    networks:
      - startup_2_network

networks:
  startup_2_network:
    driver: bridge

  shared_db:
    external: true
